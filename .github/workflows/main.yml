name: VCA Restock Monitor

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "運行模式"
        type: choice
        options:
          - check
          - test-email
          - test-bark
        default: test-bark

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安裝依賴
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: 運行監控
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          PRODUCT_URL: ${{ vars.PRODUCT_URL }}
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ "$MODE" = "test-email" ]; then python monitor.py --test-email
          elif [ "$MODE" = "test-bark" ]; then python monitor.py --test-bark
          else python monitor.py; fi
      - name: 上傳截圖
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot
          path: screenshot.png
          if-no-files-found: ignore
